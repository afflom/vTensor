[package]
name = "vtensor-backend"
description = "GGML device and buffer integration driven by Prism models and Verdant tensor execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vtensor_attention = { version = "=0.1.0", path = "../../generated/attention/packages/rust-core/vtensor_attention" }
vtensor_attention_mask = { version = "=0.1.0", path = "../../generated/attention/packages/rust-core/vtensor_attention_mask" }
vtensor_matrix_q8 = { version = "=0.1.0", path = "../../generated/matrix/packages/rust-core/vtensor_matrix_q8" }
vtensor_rotary = { path = "../../generated/rotary/packages/rust-core/vtensor_rotary", version = "=0.1.0" }
vtensor_typed = { path = "../../generated/typed/packages/rust-core/vtensor_typed", version = "=0.1.0" }
vtensor_matrix_execution = { version = "0.1.0", path = "../../generated/matrix/packages/rust-core/vtensor_matrix_execution" }
vtensor_pointwise = { version = "0.1.0", path = "../../generated/pointwise/packages/rust-core/vtensor_pointwise" }
vtensor_repeat_offset = { version = "0.1.0", path = "../../generated/pointwise/packages/rust-core/vtensor_repeat_offset" }
verdant-tensor = { workspace = true }
vtensor_layout = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_layout" }
vtensor_types = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_types" }
vtensor_buffer_region = { version = "=0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_buffer_region" }
vtensor_transfer = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_transfer" }
vtensor_native_config = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_config" }
vtensor_native_predicates = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_predicates" }
vtensor_native_memory = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_memory" }

[dev-dependencies]
vtensor_probes = { version = "=0.1.0", path = "../../generated/probes/packages/rust-core/vtensor_probes" }
vtensor_spatial = { version = "0.1.0", path = "../../generated/spatial/packages/rust-core/vtensor_spatial" }
vtensor_arithmetic = { version = "0.1.0", path = "../../generated/arithmetic/packages/rust-core/vtensor_arithmetic" }
vtensor_fixture_stream = { version = "0.1.0", path = "../../generated/fixtures/packages/rust-core/vtensor_fixture_stream" }
vtensor_fixtures = { version = "0.1.0", path = "../../generated/fixtures/packages/rust-core/vtensor_fixtures" }
vtensor_index = { version = "0.1.0", path = "../../generated/index/packages/rust-core/vtensor_index" }
proc-macro2 = "1.0.107"
repo-model = { workspace = true }
prism-kernel = { workspace = true }
sha2 = "0.11.1"
serde_json = "1.0.151"
toml = "1.2"

vtensor_allocation = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_allocation" }

[lints]
workspace = true
