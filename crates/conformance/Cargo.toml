[package]
name = "vtensor-backend"
description = "GGML device and buffer integration driven by Prism models and Verdant tensor execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vtensor_pointwise = { version = "0.1.0", path = "../../generated/pointwise/packages/rust-core/vtensor_pointwise" }
vtensor_repeat_offset = { version = "0.1.0", path = "../../generated/pointwise/packages/rust-core/vtensor_repeat_offset" }
vtensor_index = { version = "0.1.0", path = "../../generated/index/packages/rust-core/vtensor_index" }
verdant-tensor = { workspace = true }
vtensor_layout = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_layout" }
vtensor_types = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_types" }
vtensor_transfer = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_transfer" }
vtensor_native_config = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_config" }
vtensor_native_predicates = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_predicates" }
vtensor_native_memory = { version = "0.1.0", path = "../../generated/native/packages/rust-core/vtensor_native_memory" }

[dev-dependencies]
vtensor_matrix = { version = "0.1.0", path = "../../generated/matrix/packages/rust-core/vtensor_matrix" }
proc-macro2 = "1.0.107"
repo-model = { workspace = true }
prism-kernel = { workspace = true }
sha2 = "0.11.1"
serde_json = "1.0.151"
toml = "1.2"

vtensor_allocation = { version = "0.1.0", path = "../../generated/layout/packages/rust-core/vtensor_allocation" }

[lints]
workspace = true
