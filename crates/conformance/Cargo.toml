[dependencies]
vtensor_l2 = { version = "0.1.0", path = "../../generated/norm/packages/rust-core/vtensor_l2" }
vtensor_norm_plan = { version = "0.1.0", path = "../../generated/norm/packages/rust-core/vtensor_norm_plan" }
vtensor_norm = { version = "0.1.0", path = "../../generated/norm/packages/rust-core/vtensor_norm" }
