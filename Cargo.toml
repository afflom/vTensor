[workspace]
resolver = "2"
members = ["generated/typedfixtures/packages/rust-core/vtensor_typedfixtures", "generated/typed/packages/rust-core/vtensor_typed", "generated/rmsbackfixtures/packages/rust-core/vtensor_rmsbackfixtures", "generated/norm/packages/rust-core/vtensor_rms_backward", "generated/groupfixtures/packages/rust-core/vtensor_groupfixtures", "generated/normfixtures/packages/rust-core/vtensor_normfixtures", "generated/norm/packages/rust-core/vtensor_l2", "generated/norm/packages/rust-core/vtensor_norm_plan", "generated/norm/packages/rust-core/vtensor_norm", "generated/spatial/packages/rust-core/vtensor_spatial", "generated/arithmetic/packages/rust-core/vtensor_arithmetic", "generated/fixtures/packages/rust-core/vtensor_fixtures", "generated/matrix/packages/rust-core/vtensor_matrix_execution", "generated/matrix/packages/rust-core/vtensor_matrix_q8", "generated/pointwise/packages/rust-core/vtensor_pointwise", "generated/pointwise/packages/rust-core/vtensor_repeat_offset", "generated/index/packages/rust-core/vtensor_index", "generated/matrix/packages/rust-core/vtensor_matrix", "crates/*", "xtask", "generated/layout/packages/rust-core/vtensor_layout", "generated/layout/packages/rust-core/vtensor_types", "generated/layout/packages/rust-core/vtensor_transfer", "generated/layout/packages/rust-core/vtensor_allocation", "generated/native/packages/rust-core/vtensor_native_config", "generated/native/packages/rust-core/vtensor_native_predicates", "generated/native/packages/rust-core/vtensor_native_memory"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raise this when something here needs a newer compiler; nothing does yet.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afflom/vTensor"
homepage = "https://github.com/afflom/vTensor"
authors = ["Alex"]
keywords = ["ggml", "tensor", "inference", "verdant"]
categories = ["science", "algorithms"]

[workspace.dependencies]
prism-kernel = { package = "vtensor-prism-kernel", version = "0.1.0", path = "crates/prism-kernel" }
repo-model = { version = "0.1.0", path = "crates/model" }
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
vtensor-backend = { version = "0.1.0", path = "crates/conformance" }
verdant-tensor = { version = "=2.17.0", git = "https://github.com/afflom/verdant-engine", rev = "97528328fe73591dc1528fa96d2dcad5291966bc" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Optimize certified arithmetic during development; native effects and tests
# retain the development profile's assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.vtensor_pointwise]
opt-level = 2
